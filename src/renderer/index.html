<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待办清单</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <button id="btn-drawer" class="icon-btn" title="项目列表" aria-label="项目列表"></button>
      <div id="tb-title" class="tb-title"></div>
      <div class="tb-spacer"></div>
      <button id="btn-mode" class="icon-btn" aria-label="切换模式"></button>
      <button id="btn-settings" class="icon-btn" title="设置" aria-label="设置"></button>
      <button id="btn-min" class="icon-btn win-btn" title="最小化" aria-label="最小化"></button>
      <button id="btn-max" class="icon-btn win-btn" title="最大化" aria-label="最大化"></button>
      <button id="btn-close" class="icon-btn win-btn" aria-label="关闭"></button>
    </header>

    <div id="body">
      <aside id="sidebar" aria-label="项目">
        <ul id="project-list" class="proj-list"></ul>
        <form id="new-project" autocomplete="off">
          <input id="new-project-input" type="text" maxlength="40" placeholder="新建项目，回车确认" aria-label="新建项目名称">
          <button type="submit" class="icon-btn" title="新建项目" aria-label="新建项目"></button>
        </form>
      </aside>
      <div id="scrim"></div>

      <main id="main">
        <div id="toolbar">
          <div class="search-box">
            <span id="search-icon" class="search-icon"></span>
            <input id="search" type="text" placeholder="搜索任务、备注、标签（Ctrl+F）" aria-label="搜索任务" autocomplete="off">
            <button id="search-clear" class="icon-btn small" title="清除搜索" aria-label="清除搜索" hidden></button>
          </div>
          <button id="btn-filter" class="icon-btn filter-btn" title="按标签筛选" aria-label="按标签筛选">
            <span id="filter-badge" class="count-badge" hidden></span>
          </button>
        </div>
        <div id="tagbar" hidden></div>
        <div id="list"></div>
        <form id="composer" autocomplete="off">
          <select id="compose-project" aria-label="添加到项目" hidden></select>
          <input id="compose-input" type="text" maxlength="200" placeholder="添加任务，回车确认（可用 #标签）" aria-label="添加任务">
          <button type="submit" class="icon-btn accent" title="添加" aria-label="添加"></button>
        </form>
      </main>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>

  <script src="../shared/tasks.js"></script>
  <script src="icons.js"></script>
  <script src="dom.js"></script>
  <script src="app.js"></script>
</body>
</html>
